apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: switcher-mcp-server
  labels:
    {{- include "switcher-mcp-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "switcher-mcp-server.selectorLabels" . | nindent 4 }}
